include: package:lints/recommended.yaml

analyzer:
  # example/ is a Flutter app with its own analysis, run by the example CI job
  exclude:
    - example/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # every public API member is documented (checked in CI)
    - public_member_api_docs
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures

# For more information about the core and recommended set of lints, see
# https://dart.dev/go/core-lints
