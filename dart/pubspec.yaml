name: payway_partner
description: ABA PayWay partner API client for Dart and Flutter. Register merchants, decrypt the pushback and inquire merchant info.
version: 2.0.0
repository: https://github.com/kechankrisna/payway-partner/tree/main/dart
issue_tracker: https://github.com/kechankrisna/payway-partner/issues

environment:
  sdk: ^3.9.0

# Add regular dependencies here.
dependencies:
  dio: ^5.4.0 # http client
  crypto: ^3.0.3 # hash helper
  pointycastle: ^4.0.0
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.16.1
  dotenv: ^4.1.0
  json_serializable: ^6.14.1
  lints: ^6.0.0
  test: ^1.21.0
